# Build l'image du serveur MCP et la pousse vers le registre managé Cloudflare.
# Permet de déployer le Worker coach-mcp (image épinglée) depuis n'importe quel
# poste, sans Docker local. Secrets requis : CLOUDFLARE_API_TOKEN (Containers:Edit
# + Cloudchamber:Edit + Account Settings:Read), CLOUDFLARE_ACCOUNT_ID.
name: build-container

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - pyproject.toml
      - src/**
      - .github/workflows/build-container.yml
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # N'affiche JAMAIS les valeurs — seulement longueur et conformité du format.
      - name: Diagnostic secrets (longueur/charset, sans fuite)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "token: longueur=${#CLOUDFLARE_API_TOKEN} (attendu: 40)"
          if [[ "$CLOUDFLARE_API_TOKEN" =~ ^[A-Za-z0-9_-]+$ ]]; then echo "token: charset OK"; else echo "token: CARACTERES INVALIDES (espace/retour ligne/unicode ?)"; fi
          echo "account_id: longueur=${#CLOUDFLARE_ACCOUNT_ID} (attendu: 32)"
          if [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]+$ ]]; then echo "account_id: charset OK"; else echo "account_id: CARACTERES INVALIDES"; fi

      - name: Vérifier le token (whoami + scopes)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.79.0 whoami

      - name: Build & push vers registry.cloudflare.com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG: debug
        run: |
          IMAGE="coach-mcp-coachmcpcontainer:${GITHUB_SHA::8}"
          # Version épinglée = celle qui push déjà avec succès depuis le poste perso (coach repo).
          npx wrangler@4.79.0 containers build -p -t "$IMAGE" .

      # Repo public : on filtre tout ce qui ressemble à un credential avant d'afficher.
      - name: Logs wrangler (échec seulement)
        if: failure()
        run: grep -riv "authorization\|token\|password\|secret" ~/.config/.wrangler/logs/*.log | tail -100

      # Pas d'URI complet dans le summary : l'account ID resterait lisible en public.
      - name: Résumé
        run: |
          IMAGE="coach-mcp-coachmcpcontainer:${GITHUB_SHA::8}"
          {
            echo "### Image poussée"
            echo '```'
            echo "$IMAGE"
            echo '```'
            echo "À épingler dans coach-trail-running/infra/oauth-worker/wrangler.jsonc :"
            echo '`registry.cloudflare.com/<ACCOUNT_ID>/'"$IMAGE"'`'
          } >> "$GITHUB_STEP_SUMMARY"
